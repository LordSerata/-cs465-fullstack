<h2 class="mb-3">Edit Trip</h2>
@if (message) {
<div class="alert alert-danger">{{ message }}</div>
}
<form [formGroup]="editForm" (ngSubmit)="onSubmit()">
  <input type="hidden" formControlName="_id">
  @for (field of ['code', 'name', 'length', 'start', 'resort', 'perPerson', 'image']; track field) {
  <div class="mb-3">
    <label class="form-label" [for]="field">{{ field }}</label>
    <input [id]="field" [type]="field === 'start' ? 'date' : 'text'" class="form-control"
           [formControlName]="field" [readonly]="field === 'code'" [class.is-invalid]="submitted && f[field].errors">
    @if (submitted && f[field].errors) {
    <div class="invalid-feedback">{{ field }} is required</div>
    }
  </div>
  }
  <div class="mb-3">
    <label class="form-label" for="description">description</label>
    <textarea id="description" rows="5" class="form-control" formControlName="description"
              [class.is-invalid]="submitted && f['description'].errors"></textarea>
    @if (submitted && f['description'].errors) {
    <div class="invalid-feedback">description is required</div>
    }
  </div>
  <button type="submit" class="btn btn-primary">Update</button>
  <a class="btn btn-secondary ms-2" href="/">Cancel</a>
</form>
