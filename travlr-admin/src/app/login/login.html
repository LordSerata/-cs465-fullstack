<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h2 class="mb-3">Admin Login</h2>
    @if (formError) {
    <div class="alert alert-danger">{{ formError }}</div>
    }
    <form (ngSubmit)="onLoginSubmit()">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input id="email" name="email" type="email" class="form-control" [(ngModel)]="credentials.email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control" [(ngModel)]="credentials.password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
  </div>
</div>
