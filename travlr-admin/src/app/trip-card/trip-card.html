<div class="card h-100 shadow-sm">
  <img class="card-img-top" [src]="imageBase + trip().image" [alt]="trip().name">
  <div class="card-body">
    <h5 class="card-title">{{ trip().name }}</h5>
    <h6 class="card-subtitle mb-2 text-muted">{{ trip().resort }}</h6>
    <p class="mb-1"><strong>Code:</strong> {{ trip().code }}</p>
    <p class="mb-1"><strong>Length:</strong> {{ trip().length }}</p>
    <p class="mb-1"><strong>Start:</strong> {{ trip().start | date: 'longDate' }}</p>
    <p class="mb-2"><strong>Per person:</strong> {{ trip().perPerson }}</p>
    <p class="card-text" [innerHTML]="trip().description"></p>
  </div>
  <div class="card-footer d-flex gap-2">
    <button type="button" class="btn btn-primary" (click)="editTrip()">Edit</button>
    <button type="button" class="btn btn-danger" (click)="deleteTrip()">Delete</button>
  </div>
</div>
